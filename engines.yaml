        temperature: 0.75
        max_input_tokens: 262144
        max_output_tokens: 8192
        default_max_tokens: 4096
        license: apache-2.0
        local_inference:
          mlx_supported: true
          ollama_tag: gemma4:26b
        backend_notes:
          ollama: "25.2B total / 3.8B active MoE. 16-19GB; -mlx, -mlx-bf16, -nvfp4 and -mxfp8 variants."
      - name: gemma4:12b
        display_name: Gemma 4 12B
