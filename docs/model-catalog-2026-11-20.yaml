gemma_check_2026_11_20: Google's Gemma release page lists EmbeddingGemma 2 (2026-10-06) as its only release after
  Gemma 4 12B (2026-06-03); no newer Gemma chat model exists, so the Gemma 4 entries stand.
removed:
  '2026-11-20':
    cloud:
      gpt-6-astra: superseded by gpt-6.2-astra
      gpt-6.1-sol: superseded by gpt-6.2-sol
      claude-fable-5-1: superseded by claude-fable-5-2
      gemini-4-argon: absent from Google's model comparison, which now covers Carbon, Neon, Hydrogen and Flash-Lite;
        Neon and Carbon take its role
      gemini-3.8-flash: superseded by gemini-4-hydrogen
  '2026-11-06':
    cloud:
    - gpt-6-sol
    - gpt-5.6-sol
    - gpt-5.6-terra
    - gpt-5.6-luna
    - claude-fable-5
    - claude-opus-4-8
    - claude-sonnet-5
    - claude-haiku-4-5-20251001
    - gemini-3.1-pro-preview
    - gemini-3-flash-preview
    - gemini-3.1-flash-lite-preview
    local:
      qwen3.6:35b-a3b: superseded by the Qwen3.8 generation
      qwen3.6:27b: superseded by qwen3.8:27b
      llama4:scout: superseded by muse-glimmer:30b
      llama4:maverick: superseded by muse-glimmer:30b
      deepseek-v3.2:671b: Ollama page retired 2026-07-15; V4 and V4.1 are cloud-only on Ollama
      mistral-large-3:675b: local tag no longer published; Mistral Large 4 is cloud-only on Ollama
      mistral-small-4:119b: no Ollama library page
not_included:
  ollama_cloud_tags: deepseek-v4-pro, deepseek-v4.1-flash, mistral-large-4 and muse-spark-open exist on
    Ollama only as :cloud tags, which run on Ollama's servers; routing treats the ollama provider as local,
    so they are excluded.
  nemotron-3.5-lightning: license and release date could not be verified (2026-11-06)
  claude-mythos-5-2: available only to organizations verified through Anthropic's programs, as Mythos 5.1 was
