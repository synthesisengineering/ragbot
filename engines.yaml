  - name: ollama
    # Local Ollama server (no API key required; uses MLX backend on Apple Silicon).
    # Models are pulled with `ollama pull <tag>` and served at
    # http://localhost:11434. LiteLLM routes via the ollama_chat/ prefix
    # added in config.py::normalize_model_id.
    #
    # Hardware sizing: see docs/sizing-matrix.md for per-Mac model fit
    # tables (FP16 vs Q4 footprint, comfortable / tight / requires-quant
    # tiers) and expected MLX tokens/sec across Mac mini, MacBook Air,
    # MacBook Pro, and Mac Studio.
    models:
      # Verified 2026-11-06 against the Ollama library tag pages and the model
      # cards; sources in docs/model-catalog-2026-11-06.yaml. Only models with a
      # local Ollama tag belong here: `:cloud` tags run on Ollama's servers, and
      # routing treats this provider as local (synthesis_engine.config.is_local_model_id).
      # Gemma 4 (2026-03-31) is the current Gemma generation.
      - name: gemma4:31b
        display_name: Gemma 4 31B
        tier: judgment
        is_flagship: true
        supports_system_role: true
        max_temperature: 1
        temperature: 0.75
        max_input_tokens: 262144
        max_output_tokens: 8192
        default_max_tokens: 4096
        license: apache-2.0
        local_inference:
          mlx_supported: true
          ollama_tag: gemma4:31b
        backend_notes:
          ollama: "30.7B dense. 19-20GB at Q4; -mlx, -mlx-bf16, -nvfp4 and -mxfp8 variants."
      # Qwen3.8 supersedes Qwen3.6; its card benchmarks against Qwen3.6-27B.
      - name: qwen3.8:27b
        display_name: Qwen3.8 27B
        tier: routine
        supports_system_role: true
        max_temperature: 1
        temperature: 0.75
        max_input_tokens: 262144
        max_output_tokens: 8192
        default_max_tokens: 4096
        license: apache-2.0
        local_inference:
          mlx_supported: true
          ollama_tag: qwen3.8:27b
        thinking:
          supported: true
          mode: hybrid
          modes: [thinking, instruct]
        backend_notes:
          ollama: "27B dense with vision (2026-08). 18GB at Q4; 56GB as -mlx-bf16; -nvfp4, -mxfp8 and -q8_0 variants. Thinking on by default."
      - name: gemma4:26b
