[pytest]
# --tb=short keeps tracebacks useful without dumping frame arguments.
# Rationale: a full traceback through litellm's HTTP handler printed the
# live api_key kwarg into test output (2026-07-14). Secrets never belong
# in test logs regardless of how the failure is rendered.
addopts = --tb=short
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:Using `@model_validator`.*:pydantic.warnings.PydanticDeprecatedSince212:google\.genai\.types
