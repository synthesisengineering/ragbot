# Continuous integration for Ragbot.
#
# Why this exists: the repository already carried a substantial, fast test
# suite — 895 Python tests and 24 web tests, both under fifteen seconds — and
# nothing ran it automatically. Twenty-one open dependency pull requests had
# therefore accumulated with no pass/fail signal on any of them, which turns
# every dependency decision into a reviewer's guess about a changelog. A test
# suite nobody runs on a pull request is documentation, not a gate.
#
# Both jobs are deliberately secret-free so they run on forked pull requests
# and on Dependabot's restricted token. The Python job mirrors the Makefile's
# own `test-fast` target rather than restating the pytest invocation, so the
# Makefile stays the single source of truth for how tests are run; `test-fast`
# is the repository's declared no-integration target and excludes the one
# module that needs live provider credentials.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same ref carries no information. Cancel it rather
# than paying for it, but never cancel a run on main — those are the ones the
# history is read from.
#
# On main the group is keyed by commit, not by ref. `cancel-in-progress: false`
# alone does not protect main: a concurrency group holds one running and one
# pending run, and a newer pending run replaces the older one. When several
# pull requests merged within a minute on 2026-11-06, every intermediate main
# run was cancelled that way, so those commits had no CI result. A group per
# commit gives each push to main its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    name: python (3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The version the suite is verified against, and the one the
          # backend image runs (python:3.14-slim). 3.14 is the newest release
          # every dependency ships wheels for; see the Dockerfile.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: make install

      # Catches packages whose installed versions violate another installed
      # package's declared requirements. Cheap, and it fails the job rather
      # than printing into a log nobody reads.
      #
      # Stated plainly: this would NOT have caught the 2026-09-03 openai/LiteLLM
      # incident, because litellm 1.83.0's metadata was satisfied by openai 3 —
      # it simply predated the bound later releases added. Metadata checks can
      # only enforce what upstream declared. The guard against that failure is
      # the version floors and caps in requirements.txt, not this step.
      #
      # Note for anyone running this locally on Apple Silicon: `pip check`
      # exits non-zero there with "nvidia-cusparselt-cu13 ... is not supported
      # on this platform". That is a missing arm64 wheel for a transitive CUDA
      # package, not a dependency conflict, and it does not occur on the amd64
      # runner this job uses. Read the output rather than the exit code before
      # concluding your change broke something.
      - name: Check for dependency conflicts
        run: python -m pip check

      - name: Run the test suite
        run: make test-fast

  web:
    name: web (node 26)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the web image (node:26-alpine), the active LTS line.
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: the lockfile is the contract, and a job that silently
      # resolves a different tree than a developer's checkout cannot verify a
      # dependency bump.
      #
      # This step required the lockfile to be generated on Linux. Generated on
      # macOS it omits `@emnapi/runtime@1.11.3`, which `@napi-rs/wasm-runtime`
      # resolves only on Linux, and `npm ci` refuses a lockfile that does not
      # match the manifest. Regenerating on macOS cannot fix that and made
      # things worse when forced — see docs/security/dependabot-triage-2026-09.md.
      # If this step ever fails on a missing optional package again, regenerate
      # the lockfile in a Linux container rather than on a developer machine:
      #   docker run --rm -v "$PWD:/w" -w /w node:26 npm install --package-lock-only
      # The current lockfile is verified to satisfy `npm ci` on both Linux and
      # macOS, so the container is a repair tool, not part of the normal flow.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run the test suite
        run: npm run test

      # Lint and the unit suite never run the production build, which is where
      # Next.js type-checks the app and where it refuses to build a version
      # with known security advisories. Without this step, a `next` version that
      # cannot build passes CI: PR #124 at next 16.4.0 stayed green here, and on
      # 2026-11-06 `next build` on that version exited 1. See
      # docs/security/dependabot-triage-2026-11.md.
      - name: Build
        run: npm run build
