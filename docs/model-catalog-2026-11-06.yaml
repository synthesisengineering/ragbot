    - gpt-5.6-sol
    endpoint_account_availability: listed for the owner's key (2026-11-06)
    live_request_acceptance: not measured (account out of credit)
    notes:
    - Drops the `none` effort level GPT-6 Sol had.
    - Tool calling through the Responses API only.
