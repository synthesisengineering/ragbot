product_policy:
  default_max_tokens: 8192
  max_temperature_ui_cap: 1
  temperature: null
  existing_model_values_and_explicit_defaults: unchanged
  role_preference: First matching model follows the exact reviewed synthesis-model-tiers table, including
    local Qwen judgment preference. This does not replace an explicit user model.
  unsupported_explicit_effort: reject; never substitute a lower or default effort
  pricing: No new price fields or zero-price placeholders. Existing dependency price data is retained;
    absent/null price remains unknown.
transport:
  OpenAI: Chat Completions uses max_completion_tokens. Sampling controls omitted under reasoning. Unsupported
    tool/effort combinations require Responses API and fail explicitly without lowering effort.
  Anthropic: Adaptive thinking and output_config.effort preserved through direct SDK and LiteLLM. No temperature
    or manual thinking budgets.
  Google: Direct SDK uses thinking_level; LiteLLM uses reasoning_effort. Gemini 3.8 does not accept minimal.
  LiteLLM: Tested floor 1.102.1. Register only documented capabilities through register_model with persist_across_reloads=False;
    do not infer or register prices. Per-request drop_params=False. Older bundled maps lack new Anthropic
    capability flags.
client_boundary:
  provider_api_ids: These identifiers describe provider APIs or the LiteLLM Gemini namespace.
  native_client_selectors: Not inferred from this product catalog; existing user client selection and
    effort remain unchanged.
  offline: No paid or live provider generation in verification.
tier_fixture_sha256: 04bc5b220ec3bf301b59ac51a3a67e165bf3039c32a948e7edd77d8bfcf0559a
transport_merge_contract:
  final_body: The SDK merges extra_body after typed arguments. Conflicting model identity, effort,
    token-limit fields, thinking, sampling, or unsupported tool controls fail before serialization.
  extensions: Unrelated body fields and transport headers remain supported. Anthropic output_config
    siblings merge with the explicit effort, and adaptive-thinking extensions retain the required type.
  native_identifiers: Unqualified identifiers use the unique verified catalog match; ambiguous matches
    require a provider prefix. Native wire identifiers stay separate from LiteLLM provider prefixes.
  capability_registration: Only verified reasoning flags and provider identity may change. Existing
    mode, input/output allowances, price fields and unrelated models remain byte-value equivalent.
    Same-provider canonical aliases may receive the same verified capability flags. A total context
    window is not substituted for the dependency's distinct input allowance.
  unknown_costs: Missing price entries remain absent; no null or numeric price fields are manufactured.
