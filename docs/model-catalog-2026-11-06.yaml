not_included:
  ollama_cloud_tags: deepseek-v4-pro, deepseek-v4.1-flash, mistral-large-4 and muse-spark-open exist on
    Ollama only as :cloud tags, which run on Ollama's servers; routing treats the ollama provider as local,
    so they are excluded.
  nemotron-3.5-lightning: license and release date could not be verified
  claude-mythos-5-1: available only to organizations verified through Anthropic's programs
