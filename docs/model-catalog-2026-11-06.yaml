models:
  gpt-6-astra:
    sources:
    - openai-astra
    - openai-latest-model
    context_window: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    effort_modes: &id001
    - low
    - medium
    - high
    - xhigh
    - max
    reasoning_default: medium
    default_provenance: product policy (OpenAI states none)
    released: '2026-09-03'
    supersedes: []
    endpoint_account_availability: listed for the owner's key (2026-11-06)
    live_request_acceptance: not measured (account out of credit)
    notes:
    - Tool calling through the Responses API only.
  gpt-6.1-sol:
    sources:
    - openai-sol
    - openai-gpt-6-sol
    - openai-latest-model
    context_window: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    effort_modes: *id001
    reasoning_default: medium
    default_provenance: provider documentation
    released: '2026-09-29'
    supersedes:
