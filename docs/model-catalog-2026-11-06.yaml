# Model catalog verification record for engines.yaml (2026-11-06).
# Replaces docs/model-catalog-2026-09-25.yaml.
schema_version: 2
verified: '2026-11-06'
scope: 'Provider documentation and model cards fetched 2026-11-06; offline serialization through the provider
  SDKs and LiteLLM; account visibility through each provider''s list-models endpoint with the owner''s
  keys. Live completions were not measured: all three cloud accounts returned billing errors (no credit)
  that day.'
