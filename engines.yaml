# engines.yaml — LLM engine configuration for Ragbot.
#
# Updated: November 6, 2026. Every provider carries only its current models;
# superseded releases were removed rather than kept selectable. Identifiers,
# limits and request contracts were verified against provider documentation
# that day — see docs/model-catalog-2026-11-06.yaml for sources.
# First matching tier is the ordered role preference, not a user-model override.
#
# Field reference:
#   display_name       — human-readable label shown in UIs (falls back to `name` if absent)
#   tier               — role class: judgment | routine | bulk. Labels name the WORK a
#                        model is trusted with, not the artifact (see the
#                        synthesis-model-tiers skill's references/naming-rationale.md).
#                        Same vocabulary as that skill's tiers.yaml (the cross-provider
#                        ordered-preference table). tests/test_engines_yaml.py enforces
#                        that the two files agree; edit both together.
#   is_flagship        — the provider's showcase model (drives default thinking effort).
#                        Distinct from tier: Opus 5.5 is judgment-tier but not flagship,
#                        and the ollama catalog carries several flagships.
#   max_input_tokens   — the documented input limit (for OpenAI, below the context window)
#   max_output_tokens  — maximum tokens the model can generate in response
#   default_max_tokens — request default (product policy)
#   thinking           — reasoning metadata. `strict: true` entries are validated
#                        contracts: requests must use one of `modes`, and the
#                        `request_parameters` block says how the provider takes it.
#
engines:
  - name: openai
    api_key_name: OPENAI_API_KEY
    models:
      # Verified capability sources: docs/model-catalog-2026-11-06.yaml.
      # max_input_tokens is the documented input limit (922K), not the 1.05M
      # context window. Request limit 8192 and UI temperature cap 1 are product
      # policy; null omits sampling.
      - name: gpt-6-astra
        display_name: GPT-6 Astra
        tier: judgment
        is_flagship: true
        supports_system_role: true
        max_temperature: 1
        temperature: null
        max_input_tokens: 922000
        max_output_tokens: 128000
        default_max_tokens: 8192
        thinking:
          supported: true
          strict: true
          modes:
          - low
          - medium
          - high
          - xhigh
          - max
          default: medium
        request_parameters:
          token_limit: max_completion_tokens
          sampling: non_reasoning_only
          tool_calling: responses_only
      - name: gpt-6.1-sol
        display_name: GPT-6.1 Sol
        tier: routine
        supports_system_role: true
        max_temperature: 1
        temperature: null
        max_input_tokens: 922000
        max_output_tokens: 128000
        default_max_tokens: 8192
        thinking:
          supported: true
          strict: true
          modes:
          - low
          - medium
          - high
          - xhigh
          - max
          default: medium
        request_parameters:
          token_limit: max_completion_tokens
          sampling: non_reasoning_only
          tool_calling: responses_only
      - name: gpt-6.1-terra
        display_name: GPT-6.1 Terra
        tier: routine
        supports_system_role: true
        max_temperature: 1
        temperature: null
        max_input_tokens: 922000
        max_output_tokens: 128000
        default_max_tokens: 8192
        thinking:
          supported: true
          strict: true
          modes:
          - none
          - low
          - medium
          - high
          - xhigh
          - max
          default: medium
        request_parameters:
          token_limit: max_completion_tokens
          sampling: non_reasoning_only
          tool_calling: responses_only
      - name: gpt-6-luna
        display_name: GPT-6 Luna
        tier: bulk
        supports_system_role: true
        max_temperature: 1
        temperature: null
        max_input_tokens: 922000
